    <circle cx="187" cy="174" r="2" fill="#55f5b0"/>
    <circle cx="197" cy="174" r="2" fill="#55f5b0"/>
    <line x1="192" y1="166" x2="192" y2="160" stroke="#46e8ff" stroke-width="2"/>
    <circle cx="192" cy="158" r="3" fill="#55f5b0"/>
    <line x1="184" y1="190" x2="181" y2="197" stroke="#46e8ff" stroke-width="3"/>
    <line x1="200" y1="190" x2="203" y2="197" stroke="#46e8ff" stroke-width="3"/>
  </g>

  <g>
    <rect x="574" y="163" width="28" height="24" rx="6" fill="#183e48" stroke="#55f5b0" stroke-width="2"/>
    <line x1="580" y1="174" x2="596" y2="174" stroke="#d8fff0" stroke-width="2"/>
    <circle cx="583" cy="171" r="2" fill="#46e8ff"/>
    <circle cx="593" cy="171" r="2" fill="#46e8ff"/>
    <line x1="588" y1="163" x2="588" y2="157" stroke="#55f5b0" stroke-width="2"/>
    <circle cx="588" cy="155" r="3" fill="#46e8ff"/>
    <line x1="580" y1="187" x2="577" y2="194" stroke="#55f5b0" stroke-width="3"/>
    <line x1="596" y1="187" x2="599" y2="194" stroke="#55f5b0" stroke-width="3"/>
  </g>

  <g>
    <rect x="958" y="163" width="28" height="24" rx="6" fill="#272851" stroke="#a5a1ff" stroke-width="2"/>
    <line x1="964" y1="174" x2="980" y2="174" stroke="#e4e3ff" stroke-width="2"/>
    <circle cx="967" cy="171" r="2" fill="#55f5b0"/>
    <circle cx="977" cy="171" r="2" fill="#55f5b0"/>
    <line x1="972" y1="163" x2="972" y2="157" stroke="#a5a1ff" stroke-width="2"/>
    <circle cx="972" cy="155" r="3" fill="#55f5b0"/>
    <line x1="964" y1="187" x2="961" y2="194" stroke="#a5a1ff" stroke-width="3"/>
    <line x1="980" y1="187" x2="983" y2="194" stroke="#a5a1ff" stroke-width="3"/>
  </g>

  <text x="60" y="330" fill="#5d84aa" font-family="monospace" font-size="11" letter-spacing="1">STATUS: FOCUSED • SURGICAL • REVIEWABLE</text>
  <text x="1140" y="330" fill="#5d84aa" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="1">v1.0 // COMMAND CENTER</text>
</svg>
