    <path d="M858 280L878 298L924 258" fill="none" stroke="#55f5b0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M956 274H1092M956 286H1050" stroke="#83c8e6" stroke-opacity="0.55" stroke-width="3"/>
  </g>

