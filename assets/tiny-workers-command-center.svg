<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     role="img"
     aria-labelledby="banner-title banner-description">
  <title id="banner-title">Tiny-Workers command center</title>
  <desc id="banner-description">Three tiny robots coordinate orderly AI-agent work through plan, execute, and verify stages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.55" stop-color="#0b1d3b"/>
      <stop offset="1" stop-color="#10183d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122b4c"/>
      <stop offset="1" stop-color="#0b1a35"/>
    </linearGradient>
    <linearGradient id="cyan-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46e8ff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#46e8ff"/>
      <stop offset="1" stop-color="#55f5b0" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#67b9e8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#grid)"/>
  <path d="M42 84H1158" stroke="#46e8ff" stroke-opacity="0.2"/>
  <circle cx="70" cy="54" r="5" fill="#55f5b0"/>
  <circle cx="90" cy="54" r="5" fill="#46e8ff"/>
  <circle cx="110" cy="54" r="5" fill="#7c78ff"/>
  <text x="140" y="61" fill="#bcefff" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">LOCAL AGENT OPERATIONS // ONLINE</text>

  <text x="60" y="135" fill="#ffffff" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="5">TINY-WORKERS</text>
  <text x="62" y="161" fill="#86a6c8" font-family="sans-serif" font-size="14" letter-spacing="1.5">ORDERLY AI-AGENT WORK, ONE SMALL STEP AT A TIME</text>

  <g>
    <rect x="60" y="198" width="310" height="108" rx="16" fill="url(#panel)" stroke="#46e8ff" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="86" cy="224" r="8" fill="#46e8ff"/>
    <text x="106" y="230" fill="#46e8ff" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="3">PLAN</text>
    <path d="M86 251H340" stroke="#234666"/>
    <path d="M88 274H230M88 286H280" stroke="#83c8e6" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="322" cy="274" r="7" fill="#55f5b0"/>
    <circle cx="322" cy="286" r="7" fill="#7c78ff"/>
  </g>

  <g>
    <rect x="445" y="198" width="310" height="108" rx="16" fill="url(#panel)" stroke="#55f5b0" stroke-opacity="0.72" stroke-width="2"/>
    <circle cx="471" cy="224" r="8" fill="#55f5b0"/>
    <text x="491" y="230" fill="#55f5b0" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="3">EXECUTE</text>
    <path d="M471 251H725" stroke="#234666"/>
    <path d="M473 274H535L550 286H640L654 274H721" fill="none" stroke="#55f5b0" stroke-opacity="0.75" stroke-width="3"/>
    <circle cx="550" cy="286" r="5" fill="#46e8ff"/>
    <circle cx="654" cy="274" r="5" fill="#46e8ff"/>
  </g>

  <g>
